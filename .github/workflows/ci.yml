name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: timmins
          POSTGRES_PASSWORD: timmins
          POSTGRES_DB: timmins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timmins -d timmins_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://timmins:timmins@localhost:5432/timmins_test
